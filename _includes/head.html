<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.data.site.name }}</title>
<meta name="description" content="{% if page.title %}{{ page.content | strip_html | truncatewords: 30 | escape }}{% else %}{{ site.description | escape }}{% endif %}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23ff5fa8' stroke='%231a1530' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="{{ '/style.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body>
{% assign home = '/' | relative_url %}
<header>
  <div class="wrap nav">
    <a class="logo" href="{{ home }}"><span class="logo-dot" aria-hidden="true"></span>{{ site.data.site.name }}</a>
    <nav aria-label="Main">
      <ul>
        <li><a class="link" href="{{ home }}#projects">Projects</a></li>
        <li><a class="link" href="{{ home }}#about">About</a></li>
        <li><a class="link" href="{{ home }}#blog">Blog</a></li>
        <li><a class="link" href="{{ home }}#contact">Say hi</a></li>
      </ul>
    </nav>
  </div>
</header>
